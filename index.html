<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Asistente CCSS (demo académica)</title>
<style>body{font-family:system-ui,sans-serif;background:#efeae2;color:#223;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}div{max-width:420px}</style>
</head>
<body>
<div>
  <h1 style="font-size:1.2rem">Asistente de trámites de la CCSS</h1>
  <p id="estado">Abriendo la demo…</p>
  <p style="font-size:.85rem;color:#556">Demo académica (proyecto universitario): no es un canal oficial de la CCSS ni da consejo médico. Emergencias: 911.</p>
</div>
<script>
// Enlace estable: la demo corre detrás de un túnel de Cloudflare cuya dirección cambia en cada arranque; aquí se lee la
// vigente (endpoint.json, que la publica el servidor) y se redirige conservando el #t=... (el código de acceso no sale
// del navegador). Código: repo privado lucasague/ccss-chatbot.
(async () => {
  const $e = document.getElementById('estado');
  const fuentes = ['https://api.github.com/repos/lucasague/ccss-demo/contents/endpoint.json', 'endpoint.json?ts=' + Date.now()];
  for (const f of fuentes) {
    try {
      const r = await fetch(f, { cache: 'no-store', headers: f.includes('api.github.com') ? { Accept: 'application/vnd.github.raw+json' } : {} });
      if (!r.ok) continue;
      const j = await r.json();
      if (j.url && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(j.url)) { location.replace(j.url + '/chat' + location.hash); return; }
    } catch {}
  }
  $e.textContent = 'No se pudo abrir la demo ahora mismo. Inténtalo en unos minutos.';
})();
</script>
</body>
</html>
